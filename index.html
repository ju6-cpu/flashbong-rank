<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>초봉식쉼터 : 우리동네 후레쉬봉 기록</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');

:root {
    --bg-color: #070b14;
    --bg-glow: #101a2d;
    --card-bg: rgba(18, 27, 46, 0.88);
    --card-bg-2: rgba(12, 19, 34, 0.92);
    --text-main: #f8fafc;
    --text-sub: #91a0b8;
    --doctor-white: #f8fafc;
    --boss-blue: #38bdf8;
    --boss-green: #34d399;
    --boss-red: #fb7185;
    --border-color: rgba(148, 163, 184, 0.14);
    --gold: #fbbf24;
    --silver: #cbd5e1;
    --bronze: #fb923c;
}

* { box-sizing: border-box; }

html { min-height: 100%; }

body {
    min-height: 100vh;
    font-family: 'Gowun Dodum', sans-serif;
    background:
        radial-gradient(circle at 50% -10%, rgba(56,189,248,.13), transparent 34%),
        radial-gradient(circle at 0% 35%, rgba(99,102,241,.07), transparent 28%),
        linear-gradient(180deg, #0a0f1c 0%, var(--bg-color) 55%, #050810 100%);
    color: var(--text-main);
    margin: 0;
    padding: 18px 12px 30px;
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
}

.container {
    width: 100%;
    max-width: 520px;
}

/* ---------- Header ---------- */
header {
    text-align: center;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(145deg, rgba(30,45,73,.94), rgba(10,17,31,.96));
    border: 1px solid rgba(125,211,252,.16);
    border-radius: 22px;
    padding: 29px 18px 23px;
    box-shadow:
        0 18px 45px rgba(0,0,0,.34),
        inset 0 1px 0 rgba(255,255,255,.05);
}

header::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    top: -105px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(56,189,248,.14);
    filter: blur(45px);
    pointer-events: none;
}

header h1 {
    position: relative;
    margin: 0 0 9px;
    font-family: 'Jua', 'Gowun Dodum', sans-serif;
    font-size: 1.45rem;
    color: #f8fbff;
    letter-spacing: -0.8px;
    line-height: 1.35;
    text-shadow: 0 2px 18px rgba(56,189,248,.16);
}

header p {
    position: relative;
    margin: 0 0 10px;
    color: #aebbd0;
    font-size: .84rem;
}

.warning-text {
    position: relative;
    display: inline-block;
    font-size: .73rem;
    color: #fda4af;
    margin: 2px 0 8px;
    font-weight: bold;
    background: rgba(251,113,133,.075);
    border: 1px solid rgba(251,113,133,.13);
    border-radius: 999px;
    padding: 6px 10px;
}

.update-time {
    position: relative;
    font-size: .72rem;
    color: #67d4ff;
    margin: 5px 0;
    font-weight: bold;
}

.collab-text {
    position: relative;
    font-size: .68rem;
    color: #72829a;
    opacity: .9;
    margin-top: 8px;
}

.admin-trigger {
    position: absolute;
    z-index: 5;
    top: 10px;
    right: 10px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.06);
    cursor: pointer;
    padding: 8px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: .65rem;
    color: var(--doctor-white);
    opacity: .28;
    transition: .2s ease;
}

.admin-trigger:active,
.admin-trigger:hover {
    opacity: 1;
    background: rgba(56,189,248,.1);
    border-color: rgba(56,189,248,.3);
}

/* ---------- Password ---------- */
#passwordBox {
    position: relative;
    display: none;
    margin-top: 14px;
    background: rgba(5,9,17,.82);
    padding: 11px;
    border-radius: 14px;
    border: 1px dashed rgba(56,189,248,.5);
    text-align: center;
    box-shadow: inset 0 0 20px rgba(56,189,248,.035);
}

#passwordBox input {
    width: 58%;
    display: inline-block;
    margin-right: 5px;
    background: #080d17;
    border: 1px solid rgba(148,163,184,.16);
    color: white;
    padding: 10px;
    border-radius: 10px;
    font-size: .9rem;
    font-family: 'Gowun Dodum', sans-serif;
}

#passwordBox button {
    width: 32%;
    display: inline-block;
    padding: 10px;
    background: linear-gradient(135deg, #38bdf8, #22a6e6);
    color: #04111b;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: .86rem;
    font-family: 'Gowun Dodum', sans-serif;
}

/* ---------- Cards ---------- */
.card {
    background: linear-gradient(145deg, var(--card-bg), var(--card-bg-2));
    border: 1px solid var(--border-color);
    border-radius: 19px;
    padding: 17px;
    margin-bottom: 13px;
    box-shadow:
        0 12px 30px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.025);
    backdrop-filter: blur(10px);
}

#adminPanel {
    display: none;
    border-color: rgba(251,113,133,.24);
    background: linear-gradient(145deg, rgba(38,22,36,.9), rgba(18,20,35,.94));
}

#adminPanel h2 {
    margin-top: 0;
    margin-bottom: 15px;
    font-family: 'Jua', 'Gowun Dodum', sans-serif;
    font-size: 1.08rem;
}

.form-group { margin-bottom: 12px; }

label {
    display: block;
    font-size: .76rem;
    color: #9ba9be;
    margin-bottom: 6px;
    padding-left: 2px;
}

input, select, textarea {
    width: 100%;
    padding: 11px 12px;
    background-color: rgba(5,10,18,.8);
    border: 1px solid rgba(148,163,184,.15);
    border-radius: 11px;
    color: var(--text-main);
    font-size: .94rem !important;
    box-sizing: border-box;
    font-family: 'Gowun Dodum', sans-serif;
    transition: .18s ease;
}

input::placeholder, textarea::placeholder { color: #56657a; }

input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: rgba(56,189,248,.62);
    box-shadow: 0 0 0 3px rgba(56,189,248,.08);
}

.btn-submit {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #fb7185, #e95069);
    color: white;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 11px;
    font-size: .95rem;
    font-weight: bold;
    cursor: pointer;
    font-family: 'Gowun Dodum', sans-serif;
    margin-top: 5px;
    box-shadow: 0 8px 20px rgba(251,113,133,.15);
    transition: transform .15s ease, filter .15s ease;
}

.btn-submit:active { transform: translateY(1px); filter: brightness(.94); }

.backup-section {
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px dashed rgba(255,255,255,.1);
}

.backup-btns {
    display: flex;
    gap: 8px;
    margin-top: 6px;
}

.btn-backup {
    flex: 1;
    padding: 10px;
    background: rgba(56,189,248,.12);
    color: var(--boss-blue);
    border: 1px solid rgba(56,189,248,.3);
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.82rem;
    font-family: 'Gowun Dodum', sans-serif;
}

.btn-backup:active { background: rgba(56,189,248,.22); }

/* ---------- Ranking ---------- */
.search-box {
    margin-bottom: 13px;
    position: relative;
}

.search-box input {
    background: rgba(7,12,22,.72);
    padding-left: 13px;
}

.ranking-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.ranking-item {
    display: flex;
    flex-direction: column;
    background:
        linear-gradient(100deg, rgba(7,12,22,.68), rgba(18,28,47,.48));
    border: 1px solid rgba(148,163,184,.11);
    padding: 10px 11px;
    border-radius: 14px;
    transition: border-color .2s ease, transform .2s ease, background .2s ease;
}

.ranking-item:hover {
    border-color: rgba(56,189,248,.18);
    background:
        linear-gradient(100deg, rgba(9,15,27,.78), rgba(18,31,51,.62));
}

.ranking-main {
    display: flex;
    align-items: center;
    position: relative;
    width: 100%;
    min-height: 40px;
}

.rank-badge-wrapper {
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 2;
    flex-shrink: 0;
}

.rank-badge {
    width: 34px;
    height: 34px;
    border-radius: 11px;
    background: #151f33;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: .82rem;
    border: 1px solid rgba(148,163,184,.14);
    color: #8291a7;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
}

.rank-diff {
    font-size: .68rem;
    font-weight: bold;
    width: 13px;
    text-align: center;
}

.diff-up { color: var(--boss-green); }
.diff-down { color: var(--boss-red); }
.diff-same { color: #68768a; opacity: .55; }

.rank-badge.top-1 {
    background: linear-gradient(145deg, rgba(251,191,36,.25), rgba(180,83,9,.12));
    color: #fde68a;
    border: 1.5px solid rgba(251,191,36,.75);
    box-shadow: 0 0 17px rgba(251,191,36,.11), inset 0 1px 0 rgba(255,255,255,.08);
}

.rank-badge.top-2 {
    background: linear-gradient(145deg, rgba(226,232,240,.19), rgba(100,116,139,.1));
    color: #f8fafc;
    border: 1.5px solid rgba(203,213,225,.7);
    box-shadow: 0 0 14px rgba(203,213,225,.08);
}

.rank-badge.top-3 {
    background: linear-gradient(145deg, rgba(245,158,11,.2), rgba(180,83,9,.1));
    color: #fdba74;
    border: 1.5px solid rgba(245,158,11,.7);
    box-shadow: 0 0 14px rgba(245,158,11,.08);
}

.player-detail {
    position: absolute;
    left: 46px;
    right: 46px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    pointer-events: none;
    z-index: 1;
}

.player-detail * { pointer-events: auto; }

.player-name {
    position: relative;
    display: inline-block;
    width: max-content;
    max-width: 100%;
    font-weight: bold;
    font-size: .83rem;
    margin-bottom: 2px;
    word-break: break-all;
    line-height: 1.25;
}

.player-score {
    font-size: .7rem;
    color: #8190a5;
    font-weight: bold;
}

.rank-1 .player-name {
    font-size: 1.05rem;
    color: #fde68a;
    font-weight: 800;
    text-shadow: 0 0 14px rgba(251,191,36,.25);
}

.rank-1 .player-score {
    font-size: .79rem;
    color: #fef3a8;
    font-weight: bold;
}

.rank-2 .player-name {
    font-size: 1rem;
    color: #f8fafc;
    font-weight: 800;
    text-shadow: 0 0 10px rgba(248,250,252,.2);
}

.rank-2 .player-score {
    font-size: .76rem;
    color: #d9e1ea;
    font-weight: bold;
}

.rank-3 .player-name {
    font-size: .96rem;
    color: #fb923c;
    font-weight: 800;
    text-shadow: 0 0 10px rgba(251,146,60,.2);
}

.rank-3 .player-score {
    font-size: .74rem;
    color: #fed7aa;
    font-weight: bold;
}

.rank-4 .player-name { font-size: .84rem; }
.rank-4 .player-score { font-size: .70rem; }
.rank-5 .player-name { font-size: .83rem; }
.rank-5 .player-score { font-size: .69rem; }
.rank-6 .player-name { font-size: .82rem; }
.rank-6 .player-score { font-size: .68rem; }
.rank-7 .player-name { font-size: .81rem; }
.rank-7 .player-score { font-size: .67rem; }
.rank-8 .player-name { font-size: .80rem; }
.rank-8 .player-score { font-size: .66rem; }
.rank-9 .player-name { font-size: .79rem; }
.rank-9 .player-score { font-size: .65rem; }
.rank-10 .player-name { font-size: .78rem; }
.rank-10 .player-score { font-size: .64rem; }

.player-actions {
    margin-left: auto;
    display: flex;
    gap: 4px;
    align-items: center;
    z-index: 3;
}

.badge-btn {
    background: rgba(56,189,248,.08);
    color: #5dccf8;
    border: 1px solid rgba(56,189,248,.22);
    padding: 6px 8px;
    border-radius: 8px;
    font-size: .67rem;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-family: 'Gowun Dodum', sans-serif;
    white-space: nowrap;
    transition: .15s ease;
}

.badge-btn:hover {
    background: rgba(56,189,248,.15);
    border-color: rgba(56,189,248,.38);
}

.btn-delete {
    background: rgba(251,113,133,.05);
    border: 1px solid rgba(251,113,133,.12);
    color: #fb7185;
    cursor: pointer;
    font-size: .66rem;
    padding: 5px 7px;
    border-radius: 7px;
    font-family: 'Gowun Dodum', sans-serif;
}

.comment-box {
    margin-top: 8px;
    font-size: .75rem;
    color: #b8c4d4;
    background: rgba(18,27,46,.62);
    padding: 8px 10px;
    border-radius: 9px;
    border-left: 2px solid rgba(56,189,248,.65);
    line-height: 1.4;
    word-break: break-all;
    text-align: center;
}

.comment-box.comment-1 {
    background: rgba(251,191,36,.08);
    border-left: 2px solid #fbbf24;
    color: #fef08a;
}

.comment-box.comment-2 {
    background: rgba(203,213,225,.07);
    border-left: 2px solid #cbd5e1;
    color: #f1f5f9;
}

.comment-box.comment-3 {
    background: rgba(245,158,11,.08);
    border-left: 2px solid #f59e0b;
    color: #fed7aa;
}

/* ---------- Ranking card title ---------- */
.card h2 {
    font-family: 'Jua', 'Gowun Dodum', sans-serif;
    letter-spacing: -.3px;
}

/* ---------- Footer ---------- */
footer {
    text-align: center;
    font-size: .68rem;
    color: #65738a;
    margin-top: 18px;
    opacity: .75;
    letter-spacing: .2px;
}

@media (max-width: 380px) {
    body { padding-left: 9px; padding-right: 9px; }
    header { padding-left: 14px; padding-right: 14px; }
    .card { padding: 14px; }
    .player-detail { left: 43px; right: 43px; }
}

/* ===== Pixel RPG theme ===== */
.monster-scene {
    position: relative;
    height: 94px;
    margin: 15px -2px -3px;
    overflow: hidden;
    border-radius: 14px;
    background:
        linear-gradient(180deg, rgba(8,13,26,.15), rgba(5,9,17,.62)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 4px);
    border: 1px solid rgba(56,189,248,.08);
}

.pixel-stars {
    position: absolute;
    top: 5px;
    left: 0;
    width: 100%;
    text-align: center;
    color: rgba(125,211,252,.28);
    font-family: monospace;
    font-size: 10px;
    letter-spacing: 3px;
}

.monster-ground {
    position: absolute;
    left: 50%;
    bottom: 7px;
    transform: translateX(-50%);
    width: 235px;
    height: 70px;
}

.monster {
    position: absolute;
    image-rendering: pixelated;
    object-fit: contain;
    filter: drop-shadow(0 5px 3px rgba(0,0,0,.45));
    transform-origin: bottom center;
}

.monster-a {
    height: 58px;
    width: auto;
    left: 4px;
    bottom: 4px;
    animation: monsterBob 2.4s ease-in-out infinite;
}

.monster-b {
    height: 58px;
    width: auto;
    left: 88px;
    bottom: 4px;
    animation: monsterBob 2.1s ease-in-out .25s infinite;
}

.monster-c {
    height: 58px;
    width: auto;
    right: 3px;
    bottom: 4px;
    animation: monsterBob 2.7s ease-in-out .45s infinite;
}

.hit-effect {
    position: absolute;
    font-family: monospace;
    font-weight: 900;
    color: #fef08a;
    text-shadow: 1px 1px 0 #7c2d12;
    opacity: .8;
    animation: hitSpark 1.7s steps(2, end) infinite;
}

.hit-1 { left: 42px; top: 23px; font-size: 17px; }
.hit-2 { left: 145px; top: 8px; font-size: 13px; animation-delay: .55s; }
.hit-3 { right: 48px; top: 29px; font-size: 15px; animation-delay: 1s; }

.ground-line {
    position: absolute;
    left: 12%;
    right: 12%;
    bottom: 7px;
    height: 2px;
    background: repeating-linear-gradient(
        90deg,
        rgba(56,189,248,.3) 0 8px,
        transparent 8px 14px
    );
    opacity: .65;
}

@keyframes monsterBob {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-3px) scale(1.015); }
}

@keyframes hitSpark {
    0%, 55% { transform: scale(.65) rotate(-10deg); opacity: 0; }
    65% { transform: scale(1.15) rotate(8deg); opacity: 1; }
    78% { transform: scale(.9) rotate(-5deg); opacity: .8; }
    100% { transform: scale(1.3) rotate(12deg); opacity: 0; }
}

.card:first-of-type {
    border-top-color: rgba(56,189,248,.22);
}

.card:nth-of-type(2) {
    position: relative;
}

.card:nth-of-type(2)::before {
    content: "FLASHBONG • BATTLE RECORD";
    display: block;
    margin: -4px 0 9px;
    font-family: monospace;
    font-size: 8px;
    letter-spacing: 1.6px;
    color: rgba(125,211,252,.38);
}

.rank-1 .player-name::before,
.rank-1 .player-name::after {
    content: "👑";
    position: absolute;
    top: 50%;
    transform: translateY(-52%);
    font-size: .72em;
    line-height: 1;
    white-space: nowrap;
}

.rank-1 .player-name::before {
    right: 100%;
    margin-right: 4px;
}

.rank-1 .player-name::after {
    left: 100%;
    margin-left: 4px;
}

@media (max-width: 380px) {
    .monster-scene { height: 88px; }
    .monster-ground { transform: translateX(-50%) scale(.92); }
}

</style>
</head>

        <header>

            <div id="updateInfo" class="update-time">최종 갱신일시 불러오는 중...</div>

        <div class="card" id="adminPanel">
            <h2>🛠️ 랭킹 데이터 관리</h2>

            <div class="form-group">
                <label>획득 점수</label>
                <input type="number" id="inputScore" placeholder="예: 4512">
            </div>
            <div class="form-group">
                <label>플레이 영상 링크 (선택)</label>
                <input type="text" id="inputLink" placeholder="youtube.com/...">
            </div>
            <div class="form-group">
                <label>플레이어 한마디 / 메모 (선택)</label>
                <input type="text" id="inputComment" placeholder="예: 딸기야 물어~">
            </div>
            <button class="btn-submit" onclick="savePlayerRecord()">클라우드에 반영하기</button>

            <!-- 백업 및 복구 (데이터 내보내기/불러오기) 섹션 -->
            <div class="backup-section">
                <label>📦 데이터 백업 및 복구 (JSON)</label>
                <textarea id="backupTextarea" rows="4" placeholder="내보내기를 누르면 데이터가 여기에 표시됩니다. 또는 여기에 JSON을 붙여넣고 불러오기를 누르세요."></textarea>
                <div class="backup-btns">
                    <button class="btn-backup" onclick="exportData()">데이터 내보내기</button>
                    <button class="btn-backup" onclick="importData()">데이터 불러오기(적용)</button>

        <div class="card">
            <h2 style="font-size: 1rem; margin-top: 0; margin-bottom: 12px; color: var(--text-main);">🏆 실시간 랭킹</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 닉네임 검색..." oninput="renderRankings()">
            </div>

            <div class="ranking-list" id="rankingList"></div>
        </div>

        <footer>
            Flashbong Ranking System v1.0
        </footer>
    </div>

<script>
        const BIN_ID = '6aa3eab6ac6210605ac05f87';       
        const API_KEY = '$2a$10$RmfWAiw2/bYaQ0kXs9tE/O5lorlwX9gAv9xybuHxsLunGPuGw4oFG';   

        let rankings = [];
        let updatedAt = "";

        // [핵심] 관리자가 저장할 때마다 이 기본값 배열도 함께 최신화됩니다.
        let defaultRankings = [
            { name: "세레니", score: 4512 },
            { name: "백수의왕한울이", score: 3976 },
            { name: "청년주먹조벤츠", score: 3548 },

        async function fetchRankings() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY },
                    cache: 'no-store'
                });
                const data = await response.json();
                
                if (data.record && data.record.rankings && data.record.rankings.length > 0) {
                    rankings = data.record.rankings;
                    updatedAt = data.record.updatedAt || "2026/09/11 22:00";
                    // 서버 데이터가 정상이면 내부 기본값도 최신화
                    defaultRankings = JSON.parse(JSON.stringify(rankings));
                    calculateRanks();
                } else {
                    rankings = JSON.parse(JSON.stringify(defaultRankings));
                    calculateRanks();
                    updatedAt = getFormattedDate();
                }
                
                updateHeaderInfo();
                renderRankings();
                if (document.getElementById("adminPanel").style.display === "block") {
                    updatePlayerSelectOptions();
                }
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                rankings = JSON.parse(JSON.stringify(defaultRankings));
                calculateRanks();
                renderRankings();
            }
        }

        function calculateRanks() {
            rankings.sort((a, b) => b.score - a.score);
            let currentRank = 1;
            
            for (let i = 0; i < rankings.length; i++) {
                if (i > 0 && rankings[i].score < rankings[i - 1].score) {
                    currentRank = i + 1;
                }
                
                if (rankings[i].prevRank === undefined) {
                    rankings[i].prevRank = currentRank;
                }
                rankings[i].calculatedRank = currentRank;
            }
        }

        async function saveRankingsToCloud() {
            try {
                calculateRanks();
                updatedAt = getFormattedDate();
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ rankings: rankings, updatedAt: updatedAt })
                });

                if (response.ok) {
                    // [핵심 반영] 서버 저장 성공 시, 코드 내부의 defaultRankings 기본값도 즉시 최신화됨!
                    defaultRankings = JSON.parse(JSON.stringify(rankings));
                    
                    updateHeaderInfo();
                    renderRankings();
                    updatePlayerSelectOptions();
                    alert("랭킹 데이터가 클라우드에 반영되었으며, 코드 기본값도 최신화되었습니다!");
                }
            } catch (error) {
                console.error("데이터 저장 실패:", error);
                alert("저장 중 오류가 발생했습니다.");
            }
        }

        function getFormattedDate() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${yyyy}/${mm}/${dd} ${hh}:${min}`;
        }

        function updateHeaderInfo() {
            document.getElementById("updateInfo").textContent = `최종 갱신일시 : ${updatedAt}`;
        }

        function togglePasswordBox() {
            const box = document.getElementById("passwordBox");
            box.style.display = box.style.display === "block" ? "none" : "block";
        }

        function checkPassword() {
            const pwd = document.getElementById("adminPwd").value;
            if (pwd === "9246") {
                document.getElementById("adminPanel").style.display = "block";
                document.getElementById("passwordBox").style.display = "none";
                document.getElementById("adminPwd").value = "";
                updatePlayerSelectOptions();
                renderRankings();
                alert("관리자 모드가 승인되었습니다.");
            } else {
                alert("보안 암호가 올바르지 않습니다.");
            }
        }

        function updatePlayerSelectOptions() {
            const select = document.getElementById("selectPlayer");
            select.innerHTML = '<option value="NEW">+ 새로운 플레이어 등록</option>';
            rankings.forEach((p, idx) => {
                const opt = document.createElement("option");
                opt.value = idx;
                opt.textContent = `${p.name} (${p.score.toLocaleString()}점)`;
                select.appendChild(opt);
            });
        }

        function onSelectPlayerChange() {
            const val = document.getElementById("selectPlayer").value;
            if (val === "NEW") {
                document.getElementById("inputName").value = "";
                document.getElementById("inputScore").value = "";
                document.getElementById("inputLink").value = "";
                document.getElementById("inputComment").value = "";
            } else {
                const p = rankings[val];
                document.getElementById("inputName").value = p.name;
                document.getElementById("inputScore").value = p.score;
                document.getElementById("inputLink").value = p.link || "";
                document.getElementById("inputComment").value = p.comment || "";
            }
        }

        function savePlayerRecord() {
            let name = document.getElementById("inputName").value.trim();
            let score = parseInt(document.getElementById("inputScore").value);
            let link = document.getElementById("inputLink").value.trim();
            let comment = document.getElementById("inputComment").value.trim();

            if (!name || isNaN(score)) {
                alert("이름과 점수를 정확히 입력해 주세요.");
                return;
            }

            if (link && !link.startsWith('http://') && !link.startsWith('https://')) {
                link = 'https://' + link;
            }

            const selectedIdx = document.getElementById("selectPlayer").value;

            calculateRanks();
            let oldRanks = {};
            rankings.forEach(p => {
                oldRanks[p.name] = p.calculatedRank;
            });

            if (selectedIdx === "NEW") {
                const existing = rankings.find(p => p.name === name);
                if (existing) {
                    existing.prevRank = oldRanks[name] || 1;
                    existing.score = score;
                    existing.link = link;
                    existing.comment = comment;
                } else {
                    const defaultNewRank = rankings.length > 0
                        ? rankings[rankings.length - 1].calculatedRank
                        : 1;
                    rankings.push({ name, score, link, comment, prevRank: defaultNewRank });
                }
            } else {
                const idx = parseInt(selectedIdx);
                rankings[idx].prevRank = oldRanks[rankings[idx].name] || (idx + 1);
                rankings[idx].name = name;
                rankings[idx].score = score;
                rankings[idx].link = link;
                rankings[idx].comment = comment;
            }

            rankings.forEach(p => {
                if (oldRanks[p.name] !== undefined) {
                    p.prevRank = oldRanks[p.name];
                }
            });

            saveRankingsToCloud();

            document.getElementById("selectPlayer").value = "NEW";
            onSelectPlayerChange();
        }

        function removePlayer(index) {
            if (confirm(`${rankings[index].name}님의 기록을 삭제하시겠습니까?`)) {
                rankings.splice(index, 1);
                saveRankingsToCloud();
            }
        }

        function exportData() {
            const backupObj = {
                rankings: rankings,
                updatedAt: updatedAt
            };
            const textarea = document.getElementById("backupTextarea");
            textarea.value = JSON.stringify(backupObj, null, 2);
            textarea.select();
            document.execCommand('copy');
            alert("현재 랭킹 데이터가 텍스트로 변환되었으며, 클립보드에 복사되었습니다!");
        }

        async function importData() {
            const textarea = document.getElementById("backupTextarea").value.trim();
            if (!textarea) {
                alert("불러올 JSON 데이터가 비어 있습니다.");
                return;
            }
            try {
                const parsed = JSON.parse(textarea);
                if (parsed && Array.isArray(parsed.rankings)) {
                    if (confirm("붙여넣은 데이터로 랭킹을 교체하고 클라우드에 반영하시겠습니까?")) {
                        rankings = parsed.rankings;
                        updatedAt = parsed.updatedAt || getFormattedDate();
                        calculateRanks();
                        await saveRankingsToCloud();
                        alert("데이터가 성공적으로 복구 및 반영되었습니다!");
                    }
                } else {
                    alert("올바른 랭킹 JSON 형식이 아닙니다.");
                }
            } catch (e) {
                alert("JSON 파싱 오류가 발생했습니다. 텍스트를 확인해 주세요.");
            }
        }

        function renderRankings() {
            const listEl = document.getElementById("rankingList");
            const searchKeyword = document.getElementById("searchInput").value.toLowerCase().trim();
            listEl.innerHTML = "";

            calculateRanks();

            const filtered = rankings.map((player, originalIndex) => ({ ...player, originalIndex }))
                                      .filter(player => player.name.toLowerCase().includes(searchKeyword));

            if (filtered.length === 0) {
                listEl.innerHTML = `<div style="text-align: center; color: var(--text-sub); padding: 20px;">등록된 기록이 없습니다.</div>`;
                return;
            }

            filtered.forEach((player) => {
                const displayRank = player.calculatedRank;
                let rankClass = "";
                let rankStyleClass = `rank-${displayRank}`;
                let commentClass = "";

                if (displayRank === 1) {
                    rankClass = "top-1";
                    commentClass = "comment-1";
                } else if (displayRank === 2) {
                    rankClass = "top-2";
                    commentClass = "comment-2";
                } else if (displayRank === 3) {
                    rankClass = "top-3";
                    commentClass = "comment-3";
                }

                let diffHtml = `<span class="rank-diff diff-same" title="순위 변동 없음">-</span>`;
                const previousRank = Number(player.prevRank);
                const currentRank = Number(displayRank);

                if (Number.isFinite(previousRank) && Number.isFinite(currentRank)) {
                    if (currentRank < previousRank) {
                        diffHtml = `<span class="rank-diff diff-up" title="${previousRank}위 → ${currentRank}위">▲</span>`;
                    } else if (currentRank > previousRank) {
                        diffHtml = `<span class="rank-diff diff-down" title="${previousRank}위 → ${currentRank}위">▼</span>`;
                    }
                }

                let html = `
                    <div class="ranking-item">
                        <div class="ranking-main">
                            <div class="rank-badge-wrapper">
                                <div class="rank-badge ${rankClass}">${displayRank}</div>
                                ${diffHtml}
                            </div>
                            <div class="player-detail ${rankStyleClass}">
                                <div class="player-name">${escapeHtml(player.name)}</div>
                                <div class="player-score">${player.score.toLocaleString()}점</div>
                            </div>
                            <div class="player-actions">
                `;

                if (player.link) {
                    html += `<a href="${escapeHtml(player.link)}" target="_blank" class="badge-btn">🎥 영상</a>`;
                }

                if (document.getElementById("adminPanel").style.display === "block") {
                    html += `<button class="btn-delete" onclick="removePlayer(${player.originalIndex})">삭제</button>`;
                }

                html += `</div></div>`;

                if (player.comment) {
                    html += `<div class="comment-box ${commentClass}">"${escapeHtml(player.comment)}"</div>`;
                }

                html += `</div>`;
                listEl.innerHTML += html;
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        // 초기 실행: 우선 내부 기본값으로 빠르게 렌더링하고 비동기로 서버 최신 데이터 동기화
        rankings = JSON.parse(JSON.stringify(defaultRankings));
        calculateRanks();
        renderRankings();
        fetchRankings();
    </script>
